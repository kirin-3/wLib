# SPDX-License-Identifier: GPL-3.0-or-later
app-id: io.github.kirin_3.wLib
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: wlib
finish-args:
  - --talk-name=org.freedesktop.Notifications
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak
  - --env=QTWEBENGINE_DISABLE_SANDBOX=1
modules:
  - name: 7zip
    buildsystem: simple
    build-commands:
      # The SDK's GCC emits an array-bounds warning in upstream COM progress code.
      # Keep it visible without failing the build; other warnings remain errors.
      - make -C CPP/7zip/Bundles/Alone2 -f ../../cmpl_gcc.mak -j${FLATPAK_BUILDER_N_JOBS} CFLAGS_WARN_WALL="-Werror -Wall -Wextra -Wno-error=array-bounds"
      - install -Dm755 CPP/7zip/Bundles/Alone2/b/g/7zz /app/bin/7zz
      - install -Dm644 DOC/License.txt /app/share/licenses/7zip/License.txt
    sources:
      - type: archive
        url: https://github.com/ip7z/7zip/releases/download/26.05/7z2605-src.tar.xz
        sha256: 0b6080b8c3e7a579161d2d495224c0e51c467576cb4c7048b0ab485ef44cc22e
        strip-components: 0
  - name: wlib
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/wlib
      - cp -a . /app/lib/wlib/
      - mkdir -p /app/bin
      - ln -sf /app/lib/wlib/wlib /app/bin/wlib
      - install -Dm644 wlib.desktop /app/share/applications/io.github.kirin_3.wLib.desktop
      - sed -i 's/^Icon=wlib$/Icon=io.github.kirin_3.wLib/' /app/share/applications/io.github.kirin_3.wLib.desktop
      - install -Dm644 wlib.png /app/share/icons/hicolor/256x256/apps/io.github.kirin_3.wLib.png
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/io.github.kirin_3.wLib.svg
      - install -Dm644 io.github.kirin_3.wLib.metainfo.xml /app/share/metainfo/io.github.kirin_3.wLib.metainfo.xml
    sources:
      - type: dir
        path: staged
