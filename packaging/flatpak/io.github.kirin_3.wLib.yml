# SPDX-License-Identifier: GPL-3.0-or-later
app-id: io.github.kirin_3.wLib
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: wlib
finish-args:
  - --talk-name=org.freedesktop.Notifications
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak
  - --env=QTWEBENGINE_DISABLE_SANDBOX=1
modules:
  - name: wlib
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/wlib
      - cp -a . /app/lib/wlib/
      - mkdir -p /app/bin
      - ln -sf /app/lib/wlib/wlib /app/bin/wlib
      - install -Dm644 wlib.desktop /app/share/applications/io.github.kirin_3.wLib.desktop
      - sed -i 's/^Icon=wlib$/Icon=io.github.kirin_3.wLib/' /app/share/applications/io.github.kirin_3.wLib.desktop
      - install -Dm644 wlib.png /app/share/icons/hicolor/256x256/apps/io.github.kirin_3.wLib.png
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/io.github.kirin_3.wLib.svg
      - install -Dm644 io.github.kirin_3.wLib.metainfo.xml /app/share/metainfo/io.github.kirin_3.wLib.metainfo.xml
    sources:
      - type: dir
        path: staged
