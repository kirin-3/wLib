[tool.ruff]
target-version = "py312"
line-length = 88
include = ["*.py"]
exclude = [
  ".git",
  ".venv",
  "venv",
  "build",
  "dist",
  "ui/dist",
  "ui/node_modules",
]
force-exclude = true

[tool.ruff.lint]
# Keep Ruff's historical default rule set explicit so tool upgrades do not
# silently opt this established codebase into unrelated preview rule families.
select = ["E4", "E7", "E9", "F"]
