# tinyproxy for the wLib catalog builder's DLsite requests; see docs/catalog.md.
# Reached only through the builder's SSH tunnel, so it listens on loopback.
User tinyproxy
Group tinyproxy
Port 8888
Listen 127.0.0.1
Allow 127.0.0.1
Timeout 120
MaxClients 10
Syslog On
LogLevel Notice
DisableViaHeader Yes

# HTTPS to DLsite only.
ConnectPort 443
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes
