<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>wLib site settings</title><link rel="stylesheet" href="options.css"></head>
<body><main><h1>wLib site settings</h1><p>Enable wLib on the game sites you use. Your browser will ask for permission for each site.</p>
<label><input type="checkbox" data-site="dlsite"> DLsite</label>
<label><input type="checkbox" data-site="vndb"> VNDB</label>
<label><input type="checkbox" data-site="ryuugames"> Ryuugames</label>
<label><input type="checkbox" data-site="buzzheavier"> Buzzheavier downloads</label>
<p role="status" id="status"></p>
<h2>Connection to wLib</h2><p>wLib asks you once to allow this extension. Allow it only when wLib shows this code: <strong id="pairing-code">…</strong></p></main><script src="options.js"></script></body></html>
