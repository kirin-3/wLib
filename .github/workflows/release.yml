# SPDX-License-Identifier: GPL-3.0-or-later
name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v0.1.0'

# Jobs get write access only where they need it (publish).
permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/python-checks.yml

  version:
    name: Check Release Version
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # A tag must match APP_VERSION, and the extension needs a version AMO
      # has not signed yet. Manual dry runs build whatever version they name.
      - name: Check tag and extension versions
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/check-release-version.py "${GITHUB_REF#refs/tags/}"

  extension:
    name: Validate and Sign Extension
    needs: [checks, version]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - name: Lint Firefox extension
        run: npx --yes web-ext@10.7.0 lint --source-dir=extension --self-hosted

      # AMO accepts each extension version once, so only tagged releases sign;
      # manual dry runs package an unsigned XPI instead of burning the version.
      - name: Build unsigned Firefox extension (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          npx --yes web-ext@10.7.0 build \
            --source-dir=extension \
            --artifacts-dir="$RUNNER_TEMP/wlib-extension" \
            --filename=wlib-unsigned.xpi

      - name: Sign Firefox extension
        if: startsWith(github.ref, 'refs/tags/')
        env:
          WEB_EXT_API_KEY: ${{ secrets.JWT_USER }}
          WEB_EXT_API_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wlib-extension"
          npx --yes web-ext@10.7.0 sign \
            --source-dir=extension \
            --artifacts-dir="$RUNNER_TEMP/wlib-extension" \
            --channel=unlisted \
            --no-input
          test -n "$(find "$RUNNER_TEMP/wlib-extension" -maxdepth 1 -name '*.xpi' -print -quit)"

      - name: Upload validated extension
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wlib-validated-extension
          retention-days: 1
          path: ${{ runner.temp }}/wlib-extension/*.xpi

  linux:
    name: Build Linux Packages
    needs: extension
    runs-on: ubuntu-22.04
    env:
      NFPM_VERSION: v2.46.3

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download validated extension
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wlib-validated-extension
          path: ${{ runner.temp }}/wlib-extension

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install nFPM
        run: |
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate release package metadata
        if: startsWith(github.ref, 'refs/tags/')
        env:
          WLIB_MAINTAINER: ${{ vars.WLIB_MAINTAINER }}
        run: |
          if [ -z "${WLIB_MAINTAINER:-}" ]; then
            echo "Set repository variable WLIB_MAINTAINER before publishing native packages." >&2
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates libfuse2 libxcb-xkb1 libxcb-shape0 \
            libxcb-icccm4 libxcb-cursor0 libxcb-image0 libxcb-keysyms1 \
            libxcb-util1 libxcb-render-util0 libxkbcommon-x11-0 \
            flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak builder
        run: |
          flatpak install --user -y flathub org.flatpak.Builder

      - name: Build packages
        env:
          WLIB_BUILD_NATIVE_PACKAGES: '1'
          WLIB_BUILD_AUR: '1'
          WLIB_BUILD_FLATPAK: '1'
          WLIB_REQUIRE_PACKAGE_METADATA: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
          WLIB_MAINTAINER: ${{ vars.WLIB_MAINTAINER }}
          WLIB_GDRIVE_CLIENT_SECRET: ${{ secrets.WLIB_GDRIVE_CLIENT_SECRET }}
        run: |
          export WLIB_SIGNED_FIREFOX_XPI="$(find "$RUNNER_TEMP/wlib-extension" -maxdepth 1 -name '*.xpi' -print -quit)"
          chmod +x scripts/build.sh
          bash scripts/build.sh "${{ steps.version.outputs.version }}"

      # The frozen build must start: imports, bundled assets and Qt plugins
      # are only checked here, not by the source checks.
      - name: Smoke test Linux build
        env:
          QT_QPA_PLATFORM: offscreen
          # Runners may lack FUSE; run the AppImage from an extracted copy.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          TARBALL="$(find dist -maxdepth 1 -name '*linux-x86_64.tar.gz' -print -quit)"
          test -n "$TARBALL"
          SMOKE="$RUNNER_TEMP/wlib-smoke"
          mkdir -p "$SMOKE/data"
          tar -xzf "$TARBALL" -C "$SMOKE"
          BIN="$(find "$SMOKE" -maxdepth 2 -name wlib-bin -type f -print -quit)"
          WLIB_DATA_DIR="$SMOKE/data" "$BIN" --smoke-test
          APPIMAGE="$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          chmod +x "$APPIMAGE"
          WLIB_DATA_DIR="$SMOKE/data" "$APPIMAGE" --smoke-test

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wLib-${{ steps.version.outputs.version }}-linux
          retention-days: 1
          include-hidden-files: true
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.flatpak
            dist/aur/PKGBUILD
            dist/aur/.SRCINFO

  windows:
    name: Build Windows Packages
    needs: extension
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set version
        id: version
        shell: pwsh
        run: |
          $raw = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ github.event.inputs.version }}'
          } else {
            '${{ github.ref_name }}'
          }
          "version=$($raw.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Download validated extension
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wlib-validated-extension
          path: ${{ runner.temp }}/wlib-extension

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-windows.lock

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Configure optional Authenticode certificate
        shell: pwsh
        env:
          WLIB_SIGNING_CERT_BASE64: ${{ secrets.WLIB_SIGNING_CERT_BASE64 }}
          WLIB_SIGNING_CERT_PASSWORD: ${{ secrets.WLIB_SIGNING_CERT_PASSWORD }}
          WLIB_SIGNING_TIMESTAMP_URL: ${{ vars.WLIB_SIGNING_TIMESTAMP_URL }}
        run: |
          if ($env:WLIB_SIGNING_CERT_BASE64) {
            $certificate = Join-Path $env:RUNNER_TEMP 'wlib-signing.pfx'
            [IO.File]::WriteAllBytes(
              $certificate,
              [Convert]::FromBase64String($env:WLIB_SIGNING_CERT_BASE64)
            )
            "WLIB_SIGNING_CERT_PATH=$certificate" >> $env:GITHUB_ENV
            "WLIB_SIGNING_CERT_PASSWORD=$env:WLIB_SIGNING_CERT_PASSWORD" >> $env:GITHUB_ENV
            "WLIB_SIGNING_TIMESTAMP_URL=$env:WLIB_SIGNING_TIMESTAMP_URL" >> $env:GITHUB_ENV
          }

      - name: Build and smoke Windows packages
        shell: pwsh
        env:
          WLIB_GDRIVE_CLIENT_SECRET: ${{ secrets.WLIB_GDRIVE_CLIENT_SECRET }}
        run: |
          $xpi = Get-ChildItem "$env:RUNNER_TEMP\wlib-extension\*.xpi" | Select-Object -First 1
          .\scripts\build-windows.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -SignedFirefoxXpi $xpi.FullName

      - name: Validate MSI lifecycle
        shell: pwsh
        run: |
          .\scripts\test-windows-msi.ps1 `
            -MsiPath ".\dist\windows\wLib-${{ steps.version.outputs.version }}-windows-x64.msi"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wLib-${{ steps.version.outputs.version }}-windows
          retention-days: 1
          path: |
            dist/windows/*.zip
            dist/windows/*.msi
            dist/windows/*SHA256SUMS.txt

  publish:
    name: Publish Tagged Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wLib-*-*
          path: release-artifacts
          merge-multiple: true

      - name: Download validated extension
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wlib-validated-extension
          path: validated-extension

      - name: Prepare Firefox update assets
        run: |
          set -euo pipefail
          EXTVER="$(jq -r .version extension/manifest.json)"
          test -n "$EXTVER"
          XPI_SRC="$(find validated-extension -maxdepth 1 -name '*.xpi' -print -quit)"
          test -n "$XPI_SRC"
          mkdir -p release-artifacts
          cp "$XPI_SRC" "release-artifacts/wlib-firefox-${EXTVER}.xpi"
          XPI_SHA="$(sha256sum "release-artifacts/wlib-firefox-${EXTVER}.xpi" | cut -d' ' -f1)"
          jq -n \
            --arg ver "$EXTVER" \
            --arg link "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/wlib-firefox-${EXTVER}.xpi" \
            --arg hash "sha256:${XPI_SHA}" \
            '{addons: {"wlib@thekirin.net": {updates: [{version: $ver, update_link: $link, update_hash: $hash}]}}}' \
            > release-artifacts/updates.json
          cat release-artifacts/updates.json

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          REPO_URL="https://github.com/${{ github.repository }}"
          PREV_TAG="$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${VERSION}"
            COMPARE="[Full Changelog](${REPO_URL}/compare/${PREV_TAG}...${VERSION})"
          else
            RANGE="$VERSION"
            COMPARE="Full changelog unavailable (first tagged release)."
          fi
          COMMITS="$(git log "$RANGE" --no-merges --pretty=format:'- %s ([`%h`](https://github.com/${{ github.repository }}/commit/%H))' || true)"
          [ -n "$COMMITS" ] || COMMITS='- No user-facing commits found in this range.'
          {
            echo 'commits<<EOF'
            echo "$COMMITS"
            echo 'EOF'
            echo "compare=$COMPARE"
          } >> "$GITHUB_OUTPUT"

      - name: Build download links
        id: downloads
        run: |
          set -euo pipefail
          BASE="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          link() {
            local f
            f="$(find release-artifacts -maxdepth 1 -name "$1" -printf '%f\n' -quit)"
            if [ -z "$f" ]; then echo "::error::No release asset matches $1" >&2; exit 1; fi
            printf '[%s](%s/%s)' "${2:-$f}" "$BASE" "$f"
          }
          {
            echo "windows=$(link '*windows-x64.msi' MSI) · $(link '*windows-x64-portable.zip' 'Portable ZIP') · $(link '*SHA256SUMS.txt' 'SHA-256 checksums')"
            echo "linux=$(link '*.AppImage' AppImage) · $(link '*linux-x86_64.tar.gz' Tarball) · $(link '*.deb' DEB) · $(link '*.rpm' RPM) · $(link '*.flatpak' Flatpak)"
            echo "firefox=$(link 'wlib-firefox-*.xpi')"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: wLib ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          files: release-artifacts/**
          body: |
            ## Changes

            ${{ steps.changelog.outputs.commits }}

            ## Downloads

            - Windows x64 (per-user): ${{ steps.downloads.outputs.windows }}
            - Linux x86_64: ${{ steps.downloads.outputs.linux }}
            - Arch Linux (AUR): `paru -S wlib-bin` or `yay -S wlib-bin`
            - Firefox add-on (signed): ${{ steps.downloads.outputs.firefox }}. Install the XPI once through Add-ons and themes → Install Add-on From File and Firefox updates it automatically afterwards

            Windows launches `.exe`, `.bat`, `.cmd`, and `.jar` games natively.
            Wine, Proton, Winetricks, Wayland, and Linux runtime installers are Linux-only.

            ## License

            Starting with v0.3.4, wLib is licensed under GPL-3.0-or-later.

            ### Full Changelog

            ${{ steps.changelog.outputs.compare }}

  aur:
    name: Publish AUR Package
    # Stable tags only; pre-release tags such as v1.2.3-rc1 stay off the AUR.
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    needs: publish
    runs-on: ubuntu-22.04

    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wLib-${{ github.ref_name }}-linux
          path: linux-artifacts

      - name: Push PKGBUILD and .SRCINFO to wlib-bin
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          WLIB_MAINTAINER: ${{ vars.WLIB_MAINTAINER }}
        run: |
          set -euo pipefail
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::warning::AUR_SSH_PRIVATE_KEY is not set; skipping AUR publish."
            exit 0
          fi
          PKGVER="${GITHUB_REF_NAME#v}"
          AUR_SRC="$(dirname "$(find linux-artifacts -name PKGBUILD -print -quit)")"
          grep -qx "pkgver=${PKGVER}" "$AUR_SRC/PKGBUILD"

          install -dm700 "$HOME/.ssh"
          # Strip CR in case the secret was set from a CRLF file on Windows.
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          # Pinned ED25519 host key; fingerprint SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          # as published on https://aur.archlinux.org/.
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > "$HOME/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

          git clone ssh://aur@aur.archlinux.org/wlib-bin.git aur-repo
          cp "$AUR_SRC/PKGBUILD" "$AUR_SRC/.SRCINFO" aur-repo/
          cd aur-repo
          git config user.name "${{ github.repository_owner }}"
          git config user.email "$WLIB_MAINTAINER"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR already has wlib-bin ${PKGVER}."
            exit 0
          fi
          git commit -m "Update wlib-bin to ${PKGVER}"
          git push origin HEAD:master
