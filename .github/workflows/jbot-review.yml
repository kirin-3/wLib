name: J-Bot Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment: # "/jbot" reviews with both models, "/jbot --model=<provider/model>" with one
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

jobs:
  command:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/jbot') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.cmd.outputs.models }}
    steps:
      - name: Parse /jbot command
        id: cmd
        env:
          # Untrusted input: never interpolate into the script via ${{ }}.
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -f
          first_line="$(printf '%s\n' "$COMMENT_BODY" | head -n1 | tr -d '\r')"
          set -- $first_line
          [ "$1" = '/jbot' ] || { echo "::error::Not a /jbot command"; exit 1; }
          case "$#:${2:-}" in
            1:) echo "models=" >> "$GITHUB_OUTPUT" ;;
            2:--model=*)
              model="${2#--model=}"
              case "$model" in
                '' | *[!A-Za-z0-9._:/-]*) echo "::error::Invalid --model value"; exit 1 ;;
              esac
              echo "models=[\"$model\"]" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::Expected '/jbot' or '/jbot --model=<provider/model>'"; exit 1 ;;
          esac
      # Fork PRs would run the fork's code with our provider keys.
      - name: Require same-repo PR head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cross="$(gh pr view '${{ github.event.issue.number }}' --repo '${{ github.repository }}' --json isCrossRepository --jq .isCrossRepository)"
          [ "$cross" = "false" ] || { echo "::error::/jbot is disabled for fork PRs"; exit 1; }
      - name: Ack /jbot command
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes --silent

  review:
    needs: [command]
    # always(): command is skipped on pull_request events and must not skip this job.
    if: >-
      always() && (
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
        (github.event_name == 'issue_comment' && needs.command.result == 'success')
      )
    strategy:
      fail-fast: false
      matrix:
        # A comma-separated model is a pool that picks one per run, so each reviewer gets its own job.
        model: ${{ fromJSON(needs.command.outputs.models || '["opencode-go/muse-spark-1.3-contributor"]') }}
    name: review (${{ matrix.model }})
    concurrency:
      group: jbot-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ matrix.model }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # issue_comment runs on the default branch, so check out the PR head explicitly.
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}
      - uses: pgup-ai/jbot-review-action@v0
        with:
          model: ${{ matrix.model }}
          pr-number: ${{ github.event.pull_request.number || github.event.issue.number }}
          opencode-api-key: ${{ secrets.OPENCODE_API_KEY }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
