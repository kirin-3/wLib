# SPDX-License-Identifier: GPL-3.0-or-later
name: Python Checks

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  # The release workflow runs these checks before it builds anything.
  workflow_call:

permissions:
  contents: read

env:
  # Use the setup-python interpreter; never download another Python.
  UV_PYTHON_DOWNLOADS: never

jobs:
  backend-checks:
    name: Backend Checks (Python 3.12)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfuse2 \
            libegl1 \
            libgl1 \
            libxcb-xkb1 \
            libxcb-shape0 \
            libxcb-icccm4 \
            libxcb-cursor0 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-util1 \
            libxcb-render-util0 \
            libxkbcommon-x11-0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'

      - name: Run clean backend verification
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/check-python-clean.sh

  linux-frontend-checks:
    name: Frontend and Extension Checks (Linux)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      # test:unit also runs the extension tests in tests/*.test.cjs.
      - name: Run frontend checks
        working-directory: ui
        run: |
          npm ci
          npm run test:unit
          npm run typecheck
          npm run build

  windows-checks:
    name: Windows Checks (Python 3.12)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      # pwsh only reports the last command's exit code; make every native
      # command failure stop the step.
      - name: Install Python dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          uv sync --locked

      # Built first: the source smoke-mode test needs ui/dist.
      - name: Run frontend checks
        working-directory: ui
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm run test:unit
          npm run typecheck
          npm run build

      # pyrightconfig.json resolves imports from ./.venv.
      - name: Run backend checks
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          . .venv\Scripts\Activate.ps1
          ruff check .
          ruff format --check .
          basedpyright
          pytest
          python scripts/smoke_backend.py
