# SPDX-License-Identifier: GPL-3.0-or-later
name: Python Checks

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  # The release workflow runs these checks before it builds anything.
  workflow_call:

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend Checks (Python 3.12)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfuse2 \
            libegl1 \
            libgl1 \
            libxcb-xkb1 \
            libxcb-shape0 \
            libxcb-icccm4 \
            libxcb-cursor0 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-util1 \
            libxcb-render-util0 \
            libxkbcommon-x11-0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.lock

      - name: Run clean backend verification
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/check-python-clean.sh

  linux-frontend-checks:
    name: Frontend and Extension Checks (Linux)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      # test:unit also runs the extension tests in tests/*.test.cjs.
      - name: Run frontend checks
        working-directory: ui
        run: |
          npm ci
          npm run test:unit
          npm run typecheck
          npm run build

  windows-checks:
    name: Windows Checks (Python 3.12)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev-windows.lock

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      # pwsh only reports the last command's exit code; make every native
      # command failure stop the step.
      - name: Install Python dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .venv
          .venv\Scripts\python -m pip install --require-hashes -r requirements-dev-windows.lock

      # Built first: the source smoke-mode test needs ui/dist.
      - name: Run frontend checks
        working-directory: ui
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm run test:unit
          npm run typecheck
          npm run build

      # pyrightconfig.json resolves imports from ./.venv.
      - name: Run backend checks
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          . .venv\Scripts\Activate.ps1
          ruff check .
          basedpyright
          pytest
          python scripts/smoke_backend.py
