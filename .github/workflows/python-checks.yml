# SPDX-License-Identifier: GPL-3.0-or-later
name: Python Checks

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend Checks (Python 3.12)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfuse2 \
            libxcb-xkb1 \
            libxcb-shape0 \
            libxcb-icccm4 \
            libxcb-cursor0 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-util1 \
            libxcb-render-util0 \
            libxkbcommon-x11-0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Run clean backend verification
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/check-python-clean.sh

  windows-checks:
    name: Windows Checks (Python 3.12)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-windows.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      # pwsh only reports the last command's exit code; make every native
      # command failure stop the step.
      - name: Install Python dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements-dev.txt

      # Built first: the source smoke-mode test needs ui/dist.
      - name: Run frontend checks
        working-directory: ui
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm run test:unit
          npm run typecheck
          npm run build

      # pyrightconfig.json resolves imports from ./.venv.
      - name: Run backend checks
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          .venv\Scripts\Activate.ps1
          ruff check .
          basedpyright
          pytest
          python scripts/smoke_backend.py
